[build-system]
requires = ["setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "powens-firefly"
authors = [
  { name="Jules Anderson" },
]
description = "Transfer transactions from Powens to Firefly III."
readme = "README.md"
dynamic = ["version"]
requires-python = ">= 3.14"
keywords = [
    "bank",
    "Firefly-III",
    "Powens",
]
license = "AGPL-3.0"
license-files = [ "LICENSE" ]

dependencies = [
    "pyyaml",
    "requests",
    "py-powens",
    "firefly-iii-api",
    "python-dateutil",
    "aioconsole",
]

classifiers = [
    "Environment :: Console",
    "Topic :: Office/Business :: Financial",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

urls.Repository = "https://github.com/Azurennn/powens-firefly"
urls.Issues = "https://github.com/Azurennn/powens-firefly/issues"

[project.scripts]
powens-firefly = "powens_firefly.cli:main"
